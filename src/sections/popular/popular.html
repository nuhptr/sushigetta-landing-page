<section class="popular-foods" id="menu">
    <h2 class="popular-foods__title" data-animate="flip-up">Popular Food / 人気</h2>

    <div class="popular-foods__filters sushi__hide-scrollbar" data-animate="fade-up">
        <button class="popular-foods__filter-btn active">All</button>
        <button class="popular-foods__filter-btn">
            <img src="/src/assets/images/sushi-9.png" alt="Sushi image" />
            Sushi
        </button>
        <button class="popular-foods__filter-btn">
            <img src="/src/assets/images/sushi-8.png" alt="Ramen image" />
            Ramen
        </button>
        <button class="popular-foods__filter-btn">
            <img src="/src/assets/images/sushi-7.png" alt="Udon image" />
            Udon
        </button>
        <button class="popular-foods__filter-btn">
            <img src="/src/assets/images/sushi-6.png" alt="Danggo image" />
            Danggo
        </button>
        <button class="popular-foods__filter-btn">Others</button>
    </div>

    <div class="popular-foods__catalogue" data-animate="fade-up">
        <article class="popular-foods__card">
            <img
                class="popular-foods__card-image"
                src="/src/assets/images/sushi-12.png"
                alt="sushi image" />
            <h4 class="popular-foods__card-title">Chezu Sushi</h4>

            <div class="popular-foods__card-details flex-between">
                <div class="popular-foods__card-rating">
                    <img src="/src/assets/icons/star.svg" alt="Star image" />
                    <p>4.6</p>
                </div>

                <p class="popular-foods__card-price">$21.00</p>
            </div>
        </article>

        <article class="popular-foods__card active-card">
            <img
                class="popular-foods__card-image"
                src="/src/assets/images/sushi-11.png"
                alt="sushi image" />
            <h4 class="popular-foods__card-title">Riginal Sushi</h4>

            <div class="popular-foods__card-details flex-between">
                <div class="popular-foods__card-rating">
                    <img src="/src/assets/icons/star.svg" alt="Star image" />
                    <p>5.0</p>
                </div>

                <p class="popular-foods__card-price">$19.00</p>
            </div>
        </article>

        <article class="popular-foods__card">
            <img
                class="popular-foods__card-image"
                src="/src/assets/images/sushi-10.png"
                alt="sushi image" />
            <h4 class="popular-foods__card-title">Amen Legendo</h4>

            <div class="popular-foods__card-details flex-between">
                <div class="popular-foods__card-rating">
                    <img src="/src/assets/icons/star.svg" alt="Star image" />
                    <p>4.8</p>
                </div>

                <p class="popular-foods__card-price">$13.00</p>
            </div>
        </article>
    </div>

    <button class="popular-foods__button">
        Explore Foods
        <img src="/src/assets/icons/arrow-right.svg" alt="Arrow right image" />
    </button>
</section>
